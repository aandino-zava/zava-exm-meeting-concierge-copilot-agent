name: Meeting Concierge

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Configured GitHub environment
        type: environment
        required: true
      deploy:
        description: Deploy after the package checks pass
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Check source and scheduling
        run: |
          python scripts/validate.py
          if ($LASTEXITCODE -ne 0) { throw 'Source validation failed' }
          python scripts/test_resolver.py
          if ($LASTEXITCODE -ne 0) { throw 'Scheduling checks failed' }
          python scripts/test_prepare_dev_export.py
          if ($LASTEXITCODE -ne 0) { throw 'Dev export checks failed' }
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          pac-version-override: '2.13.1'
          add-tools-to-path: true
      - name: Build package
        run: ./scripts/pack-solution.ps1
      - name: Check built package and deployment scripts
        env:
          CONCIERGE_PACKAGE_PATH: build/ZavaExMMeetingConcierge.zip
        run: |
          python scripts/test_deployment.py
          if ($LASTEXITCODE -ne 0) { throw 'Package checks failed' }
          python scripts/test_verify_import.py
          if ($LASTEXITCODE -ne 0) { throw 'Post-import safeguards failed' }
          ./scripts/test-import.ps1
      - name: Save package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZavaExMMeetingConcierge
          path: |
            build/ZavaExMMeetingConcierge.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to tenant
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: meeting-concierge-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download checked package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ZavaExMMeetingConcierge
          path: build
      - name: Prepare and check tenant settings
        env:
          TARGET_URL: ${{ vars.ENVIRONMENT_URL }}
          TENANT_ID: ${{ vars.TENANT_ID }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          SETTINGS_JSON: ${{ secrets.DEPLOYMENT_SETTINGS_JSON }}
        run: |
          foreach ($value in @($env:TARGET_URL, $env:TENANT_ID, $env:CLIENT_ID, $env:SETTINGS_JSON)) {
            if ([string]::IsNullOrWhiteSpace($value)) { throw 'Complete the GitHub environment setup in docs/deployment.md.' }
          }
          foreach ($value in @($env:TENANT_ID, $env:CLIENT_ID)) {
            $parsedId = [guid]::Empty
            if (-not [guid]::TryParse($value, [ref]$parsedId)) { throw 'Tenant ID and Client ID must be GUIDs.' }
          }
          $settingsPath = Join-Path $env:RUNNER_TEMP 'concierge-settings.json'
          [System.IO.File]::WriteAllText($settingsPath, $env:SETTINGS_JSON, [System.Text.UTF8Encoding]::new($false))
          ./scripts/import-solution.ps1 -EnvironmentUrl $env:TARGET_URL -SettingsFile $settingsPath -PackagePath ./build/ZavaExMMeetingConcierge.zip -ChecksumFile ./build/SHA256SUMS.txt -ValidateOnly
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          pac-version-override: '2.13.1'
          add-tools-to-path: true
      - name: Sign in using GitHub federation
        env:
          TARGET_URL: ${{ vars.ENVIRONMENT_URL }}
          TENANT_ID: ${{ vars.TENANT_ID }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
        run: |
          pac auth create --name concierge-deploy --environment $env:TARGET_URL --tenant $env:TENANT_ID --applicationId $env:CLIENT_ID --githubFederated
          if ($LASTEXITCODE -ne 0) { throw 'Federated sign-in failed. Check the target tenant trust and application user.' }
      - name: Import checked package
        env:
          TARGET_URL: ${{ vars.ENVIRONMENT_URL }}
        run: ./scripts/import-solution.ps1 -EnvironmentUrl $env:TARGET_URL -SettingsFile (Join-Path $env:RUNNER_TEMP 'concierge-settings.json') -PackagePath ./build/ZavaExMMeetingConcierge.zip -ChecksumFile ./build/SHA256SUMS.txt
      - name: Verify imported components
        env:
          TARGET_URL: ${{ vars.ENVIRONMENT_URL }}
        run: |
          [xml]$manifest = Get-Content ./solution/unpacked/Other/Solution.xml -Raw
          $solutionName = [string]$manifest.ImportExportXml.SolutionManifest.UniqueName
          $verificationZip = Join-Path $env:RUNNER_TEMP 'concierge-verification.zip'
          $verificationFolder = Join-Path $env:RUNNER_TEMP 'concierge-verification'
          pac solution export --name $solutionName --path $verificationZip --managed false --environment $env:TARGET_URL --overwrite
          if ($LASTEXITCODE -ne 0) { throw 'Post-import export failed' }
          pac solution unpack --zipfile $verificationZip --folder $verificationFolder --packagetype Unmanaged
          if ($LASTEXITCODE -ne 0) { throw 'Post-import unpack failed' }
          python scripts/verify-import.py --folder $verificationFolder
          if ($LASTEXITCODE -ne 0) { throw 'Imported component checks failed' }
          'Package imported and component checks passed. Complete agent authentication, rule setup, publication, and calendar acceptance checks in docs/deployment.md before enabling processing.' >> $env:GITHUB_STEP_SUMMARY
      - name: Remove temporary settings and sign-in
        if: always()
        shell: pwsh
        run: |
          $settingsPath = Join-Path $env:RUNNER_TEMP 'concierge-settings.json'
          if (Test-Path -LiteralPath $settingsPath) { Remove-Item -LiteralPath $settingsPath }
          if (Get-Command pac -ErrorAction SilentlyContinue) {
            pac auth clear
            if ($LASTEXITCODE -ne 0) { throw 'Could not clear the temporary PAC profile' }
          }
